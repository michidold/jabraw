name: Release

on:
  push:
    tags:
      - "v*"

# Für das Anlegen des Releases und das Anhängen des Pakets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Auf den Commit festgenagelt: ein Tag ist verschiebbar, und diese Action
      # sieht den Quellbaum vor dem Bauen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Vollständige Historie, sonst fehlt der Text des annotierten Tags.
          fetch-depth: 0
          # Der Workflow schiebt nichts zurück; das Release legt gh mit
          # GH_TOKEN an. Ein Credential im Checkout wäre nur Angriffsfläche.
          persist-credentials: false

      - name: Check that the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n '0,/^version = /s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$tag" != "$crate" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"
        id: version

      - name: Run the tests
        run: cargo test --release --locked

      - name: Build the package
        run: ./packaging/build-deb.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          notes=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          [ -n "$notes" ] || notes="See the commit log for what changed."
          gh release create "$GITHUB_REF_NAME" \
            --title "jabraw $version" \
            --notes "$notes" \
            target/deb/jabraw_"$version"_*.deb
