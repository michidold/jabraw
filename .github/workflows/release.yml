name: Release

on:
  push:
    tags:
      - "v*"

# Lesen genügt für alles außer dem Veröffentlichen; nur der letzte Job bekommt
# Schreibrechte, damit ein kompromittierter Build sie nicht in der Hand hält.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # Auf den Commit festgenagelt: ein Tag ist verschiebbar, und diese Action
      # sieht den Quellbaum vor dem Bauen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Der Workflow schiebt nichts zurück; das Release legt gh mit
          # GH_TOKEN an. Ein Credential im Checkout wäre nur Angriffsfläche.
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit the dependencies
        run: cargo audit

  build:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Vollständige Historie, sonst fehlt der Text des annotierten Tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n '0,/^version = /s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$tag" != "$crate" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      - name: Run the tests
        run: cargo test --release --locked

      - name: Build the package
        run: ./packaging/build-deb.sh

      - name: Collect what the release needs
        run: |
          mkdir -p release
          cp target/deb/jabraw_*.deb release/
          notes=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          [ -n "$notes" ] || notes="See the commit log for what changed."
          printf '%s\n' "$notes" > release/notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/

  publish:
    runs-on: ubuntu-latest
    needs: build
    # Für das Anlegen des Releases und das Anhängen des Pakets.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "jabraw ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            jabraw_*.deb
