# WirePlumber schläfert untätige Knoten nach wenigen Sekunden ein
# (suspend-node.lua). Der Jabra-Dongle baut dann den USB-Audiostream ab, und
# beim nächsten Play vergeht spürbar Zeit, bis wieder etwas hörbar ist — es
# wirkt, als hätte der Tastendruck nichts getan.
#
# Gematcht wird über die Vendor-ID im Knotennamen, damit die Regel für alle
# Jabra-USB-Audiogeräte gilt und kein anderes Gerät trifft.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-0b0e_.*" }
      { node.name = "~alsa_input.usb-0b0e_.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
