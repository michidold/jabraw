[package]
name = "jabraw"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jabraw"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "sync"] }
futures = "0.3"
ksni = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde_json = "1.0.151"
