[package]
name = "jabraw"
version = "0.3.4"
edition = "2021"
description = "Jabra headset media keys and tray menu for Linux, via raw HID"
repository = "https://github.com/michidold/jabraw"
license = "GPL-3.0-or-later"
authors = ["Michael Dold <michidold@users.noreply.github.com>"]

[[bin]]
name = "jabraw"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "sync"] }
futures = "0.3"
ksni = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde_json = "1.0.151"
libc = "0.2.189"
